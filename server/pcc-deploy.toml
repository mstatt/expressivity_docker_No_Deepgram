agent_name = "expressivity"
# No keys are required: the page's browser transcribes the speech.
secret_set = "expressivity-secrets"
agent_profile = "agent-1x"

# Krisp's voice isolation on the microphone (bot.py's microphone_filter). "tel" is its 16 kHz model.
[krisp_viva]
    audio_filter = "tel"

[scaling]
    min_agents = 1
